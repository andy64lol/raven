name: BUILDEALO CHAVALIN

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pygame nuitka

      - name: Compilar EXE
        run: |
          python -m nuitka main.py ^
            --standalone ^
            --onefile ^
            --enable-plugin=pygame ^
            --output-filename=Raven.exe ^
            --output-dir=dist

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: raven-windows
          path: dist/Raven.exe


  mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pygame nuitka

      - name: Compilar APP
        run: |
          python -m nuitka main.py \
            --standalone \
            --enable-plugin=pygame \
            --macos-create-app-bundle \
            --output-filename=Raven \
            --output-dir=dist

      - name: Subir APP
        uses: actions/upload-artifact@v4
        with:
          name: raven-mac
          path: dist/*.app


  linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias base
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 qemu-user-static
          pip install pygame nuitka

      - name: Compilar Linux AMD64
        if: matrix.arch == 'amd64'
        run: |
          python -m nuitka main.py \
            --standalone \
            --enable-plugin=pygame \
            --output-filename=Raven \
            --output-dir=dist_amd64

      - name: Crear DEB AMD64
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p package_amd64/DEBIAN
          mkdir -p package_amd64/usr/bin

          cp -r dist_amd64/main.dist/* package_amd64/usr/bin/

          echo "Package: raven
Version: 1.0
Architecture: amd64
Maintainer: andy64lol
Description: Raven, un demo del juego" > package_amd64/DEBIAN/control

          dpkg-deb --build package_amd64 raven_amd64.deb

      - name: Compilar Linux ARM64 (Docker)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v $PWD:/app -w /app python:3.11 bash -c "
              pip install pygame nuitka &&
              python -m nuitka main.py \
                --standalone \
                --enable-plugin=pygame \
                --output-filename=Raven \
                --output-dir=dist_arm64
            "

      - name: Crear DEB ARM64
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p package_arm64/DEBIAN
          mkdir -p package_arm64/usr/bin

          cp -r dist_arm64/main.dist/* package_arm64/usr/bin/

          cat > package_arm64/DEBIAN/control <<EOF
            Package: raven
              Version: 1.0
            Architecture: arm64
Maintainer: andy64lol
Description: Raven, un demo del juego
EOF

          dpkg-deb --build package_arm64 raven_arm64.deb

          dpkg-deb --build package_arm64 raven_arm64.deb

      - name: Crear AppImage (solo AMD64)
        if: matrix.arch == 'amd64'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          cp -r dist_amd64/main.dist/* AppDir/usr/bin/

          cat > AppDir/raven.desktop <<EOF
          [Desktop Entry]
          Name=Raven
          Exec=Raven
          Type=Application
          Categories=Game;
          EOF

          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir Raven.AppImage

      - name: Subir builds Linux
        uses: actions/upload-artifact@v4
        with:
          name: raven-linux-${{ matrix.arch }}
          path: |
            raven_*.deb
            Raven.AppImage

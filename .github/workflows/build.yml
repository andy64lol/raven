name: Build Raven

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: Raven
  APP_VERSION: "0.1.0"
  PYTHON_VERSION: "3.12"

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential patchelf ccache \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 libfreetype6 libportmidi0 fakeroot dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce nuitka ordered-set zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --remove-output \
            --output-dir=build \
            --output-filename=${APP_NAME} \
            --include-data-dir=Game=Game \
            --product-name=${APP_NAME} \
            --product-version=${APP_VERSION} \
            --file-description=${APP_NAME} \
            main.py
          mv build/main.dist "build/${APP_NAME}.dist"

      - name: Package as .deb
        run: |
          PKG_DIR="pkg/${APP_NAME,,}_${APP_VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/opt/${APP_NAME}" \
                   "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications"

          cp -r "build/${APP_NAME}.dist/." "$PKG_DIR/opt/${APP_NAME}/"

          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: ${APP_NAME,,}
          Version: ${APP_VERSION}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Acidicts <alexjhayes1@hotmail.com>
          Description: ${APP_NAME} - a 2D Metroidvania game
           Built with Python and pygame-ce, compiled with Nuitka.
          EOF

          cat > "$PKG_DIR/usr/bin/${APP_NAME,,}" <<EOF
          #!/bin/sh
          exec /opt/${APP_NAME}/${APP_NAME} "\$@"
          EOF
          chmod +x "$PKG_DIR/usr/bin/${APP_NAME,,}"

          cat > "$PKG_DIR/usr/share/applications/${APP_NAME,,}.desktop" <<EOF
          [Desktop Entry]
          Name=${APP_NAME}
          Exec=/usr/bin/${APP_NAME,,}
          Type=Application
          Categories=Game;
          Terminal=false
          EOF

          fakeroot dpkg-deb --build "$PKG_DIR"
          mkdir -p artifacts
          mv "pkg/${APP_NAME,,}_${APP_VERSION}_amd64.deb" artifacts/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-deb
          path: artifacts/*.deb

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce nuitka ordered-set zstandard

      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --mingw64 `
            --windows-console-mode=disable `
            --output-dir=build `
            --output-filename=${{ env.APP_NAME }}.exe `
            --include-data-dir=Game=Game `
            --product-name=${{ env.APP_NAME }} `
            --product-version=${{ env.APP_VERSION }} `
            --file-description=${{ env.APP_NAME }} `
            main.py

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "build/${{ env.APP_NAME }}.exe" "artifacts/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-exe
          path: artifacts/*.exe

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce nuitka ordered-set zstandard

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --macos-create-app-bundle \
            --macos-app-name=${APP_NAME} \
            --macos-app-version=${APP_VERSION} \
            --output-dir=build \
            --include-data-dir=Game=Game \
            --product-name=${APP_NAME} \
            --product-version=${APP_VERSION} \
            --file-description=${APP_NAME} \
            main.py

      - name: Package .app into a zip
        run: |
          mkdir -p artifacts
          cd build
          zip -r "../artifacts/${APP_NAME}-${APP_VERSION}-macos.zip" "${APP_NAME}.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-app
          path: artifacts/*.zip

  release:
    name: Attach to Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
